<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng ký - Smart Academic &amp; Lab Support</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#131b2e",
                        "background": "#f7f9fb",
                        "inverse-primary": "#bec6e0",
                        "on-background": "#191c1e",
                        "secondary": "#0058be",
                        "on-tertiary-fixed-variant": "#38485d",
                        "tertiary-container": "#0b1c30",
                        "outline": "#76777d",
                        "primary-container": "#131b2e",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "surface-variant": "#e0e3e5",
                        "on-surface": "#191c1e",
                        "on-secondary-container": "#fefcff",
                        "surface-container": "#eceef0",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary-fixed-variant": "#004395",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary-container": "#75859d",
                        "outline-variant": "#c6c6cd",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#7c839b",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-surface-variant": "#45464d",
                        "primary-fixed-dim": "#bec6e0",
                        "primary-fixed": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#565e74",
                        "secondary-container": "#2170e4",
                        "secondary-fixed": "#d8e2ff",
                        "surface-container-high": "#e6e8ea",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary": "#000000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-max": "1440px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md antialiased">
<!-- Registration Card -->
<main class="bg-surface w-full max-w-[480px] rounded-lg shadow-[0px_1px_3px_rgba(0,0,0,0.1)] border border-surface-variant overflow-hidden flex flex-col">
<!-- Header -->
<header class="p-gutter border-b border-surface-variant text-center">
<h1 class="font-headline-md text-headline-md text-primary mb-2">Smart Academic &amp; Lab Support</h1>
<h2 class="font-headline-sm text-headline-sm text-on-surface-variant">Đăng ký tài khoản</h2>
</header>
<!-- Form Content -->
<div class="p-gutter flex-1">
<form action="#" class="space-y-4" method="POST">
<!-- Họ và tên -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullname">Họ và tên</label>
<input class="w-full h-10 px-3 bg-surface-lowest border border-outline-variant rounded focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="fullname" name="fullname" placeholder="Nhập họ và tên" type="text"/>
</div>
<!-- Email (with Error state example) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<input class="w-full h-10 px-3 bg-surface-lowest border border-error rounded focus:border-error focus:ring-1 focus:ring-error outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="email" name="email" placeholder="example@university.edu.vn" type="email" value="invalid-email"/>
<p class="mt-1 font-label-md text-label-md text-error flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">error</span> Email không hợp lệ
                    </p>
</div>
<!-- Vai trò -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2">Vai trò</label>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="text-secondary focus:ring-secondary border-outline-variant" name="role" type="radio" value="student"/>
<span class="font-body-md text-body-md text-on-surface">Sinh viên</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="text-secondary focus:ring-secondary border-outline-variant" name="role" type="radio" value="faculty"/>
<span class="font-body-md text-body-md text-on-surface">Giảng viên</span>
</label>
</div>
</div>
<!-- Khoa/Ngành Dropdown -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="department">Khoa / Ngành</label>
<div class="relative">
<select class="w-full h-10 px-3 pr-10 bg-surface-lowest border border-outline-variant rounded focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface appearance-none transition-colors cursor-pointer" id="department" name="department">
<option disabled="" selected="" value="">Chọn Khoa / Ngành</option>
<option value="cntt">Công nghệ thông tin</option>
<option value="dt">Điện tử viễn thông</option>
<option value="hh">Hóa học</option>
<option value="sh">Sinh học</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Mã số -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="id_number">Mã số (MSSV / MGV)</label>
<input class="w-full h-10 px-3 bg-surface-lowest border border-outline-variant rounded focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="id_number" name="id_number" placeholder="Nhập mã số" type="text"/>
</div>
<!-- Grid for Passwords -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Mật khẩu (with Error state example) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Mật khẩu</label>
<input class="w-full h-10 px-3 bg-surface-lowest border border-error rounded focus:border-error focus:ring-1 focus:ring-error outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="password" name="password" placeholder="••••••••" type="password" value="short"/>
<p class="mt-1 font-label-md text-label-md text-error flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">error</span> Mật khẩu phải ít nhất 8 ký tự
                        </p>
</div>
<!-- Xác nhận mật khẩu -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="confirm_password">Xác nhận mật khẩu</label>
<input class="w-full h-10 px-3 bg-surface-lowest border border-outline-variant rounded focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
</form>
</div>
<!-- Footer Actions -->
<footer class="p-gutter bg-surface-container-low border-t border-surface-variant mt-auto">
<button class="w-full h-12 bg-secondary text-on-secondary rounded flex items-center justify-center font-headline-sm text-headline-sm hover:bg-secondary-container transition-colors mb-4" type="submit">
                Tạo tài khoản
            </button>
<div class="text-center">
<span class="font-body-md text-body-md text-on-surface-variant">Đã có tài khoản?</span>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-fixed-dim underline transition-colors ml-1" href="#">Đăng nhập</a>
</div>
</footer>
</main>
</body></html>
