<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::#main-content})}" th:with="pageTitle='Phiếu chờ cấp phát'">
<body>
<div id="main-content" class="w-full max-w-7xl mx-auto space-y-6">
    <div class="flex items-center justify-between mb-2">
        <h2 class="text-2xl font-bold text-slate-800">Quản lý cấp phát / hoàn trả</h2>
    </div>

    <!-- Flash Messages -->
    <div th:if="${success}" class="p-4 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-200 flex items-center gap-2 mb-6">
        <span class="material-symbols-outlined">check_circle</span><span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="p-4 bg-red-50 text-red-700 rounded-lg border border-red-200 flex items-center gap-2 mb-6">
        <span class="material-symbols-outlined">error</span><span th:text="${error}"></span>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="overflow-x-auto w-full">
            <table class="w-full whitespace-nowrap">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-5 py-3 text-left font-semibold uppercase text-xs text-slate-500 tracking-wider w-20">ID</th>
                        <th class="px-5 py-3 text-left font-semibold uppercase text-xs text-slate-500 tracking-wider">Sinh viên</th>
                        <th class="px-5 py-3 text-left font-semibold uppercase text-xs text-slate-500 tracking-wider">Ngày tư vấn</th>
                        <th class="px-5 py-3 text-left font-semibold uppercase text-xs text-slate-500 tracking-wider">Thiết bị mượn</th>
                        <th class="px-5 py-3 text-left font-semibold uppercase text-xs text-slate-500 tracking-wider">Trạng thái</th>
                        <th class="px-5 py-3 text-right font-semibold uppercase text-xs text-slate-500 tracking-wider">Hành động</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                    <tr th:if="${records == null or #lists.isEmpty(records)}">
                        <td colspan="6" class="px-5 py-8 text-center text-slate-500">Không có phiếu cấp phát nào.</td>
                    </tr>
                    <tr th:each="record : ${records}"
                        th:unless="${records == null or #lists.isEmpty(records)}"
                        class="hover:bg-slate-50/50 transition-colors">
                        <td class="px-5 py-4 text-slate-500 font-mono" th:text="|#${record.recordId}|">#1</td>
                        <td class="px-5 py-4 font-medium text-slate-800" th:text="${record.studentName}">Tên SV</td>
                        <td class="px-5 py-4 text-slate-600" th:text="${#temporals.format(record.sessionDate, 'dd/MM/yyyy')}">12/12/2026</td>
                        <td class="px-5 py-4">
                            <ul class="list-disc list-inside text-slate-600">
                                <li th:each="item : ${record.equipmentSummary}" th:text="${item}">Thiết bị A</li>
                            </ul>
                        </td>
                        <td class="px-5 py-4">
                            <!-- status là String, không cần gọi .name() (Bug #23) -->
                            <span th:if="${record.status == 'PENDING_ADMIN_APPROVAL'}" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-800">Chờ admin duyệt</span>
                            <span th:if="${record.status == 'PENDING_DISPATCH'}" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800">Chờ cấp phát</span>
                            <span th:if="${record.status == 'DISPATCHED'}" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">Đang mượn</span>
                            <span th:if="${record.status == 'RETURNED'}" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">Đã trả</span>
                            <span th:if="${record.status == 'OVERDUE'}" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700">Quá hạn</span>
                            <span th:if="${record.status == 'REJECTED_BY_ADMIN'}" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700">Admin từ chối</span>
                        </td>
                        <td class="px-5 py-4 text-right flex items-center justify-end gap-2">
                            <a th:href="@{/admin/dispatch/{id}(id=${record.recordId})}" class="bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg px-3 py-1.5 font-medium transition-colors border border-transparent">Chi tiết</a>
                            <form th:if="${record.status == 'PENDING_ADMIN_APPROVAL' or record.status == 'PENDING_DISPATCH'}" th:action="@{/admin/dispatch/{id}/confirm(id=${record.recordId})}" method="post" onsubmit="return confirm('Xác nhận cấp phát thiết bị cho sinh viên?');">
                                <input type="text" name="adminNote" placeholder="Ghi chú..." class="w-32 px-2 py-1 text-xs border border-slate-200 rounded" />
                                <button type="submit" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-lg px-3 py-1.5 font-medium transition-colors border border-transparent">Duyệt</button>
                            </form>
                            <form th:if="${record.status == 'PENDING_ADMIN_APPROVAL' or record.status == 'PENDING_DISPATCH'}" th:action="@{/admin/dispatch/{id}/reject(id=${record.recordId})}" method="post" onsubmit="return confirm('Xác nhận từ chối cấp phát?');">
                                <input type="text" name="adminNote" placeholder="Lý do..." class="w-32 px-2 py-1 text-xs border border-slate-200 rounded" />
                                <button type="submit" class="bg-red-50 text-red-600 hover:bg-red-100 rounded-lg px-3 py-1.5 font-medium transition-colors border border-transparent">Từ chối</button>
                            </form>
                            <form th:if="${record.status == 'DISPATCHED' or record.status == 'OVERDUE'}" th:action="@{/admin/dispatch/{id}/return(id=${record.recordId})}" method="post" onsubmit="return confirm('Xác nhận thu hồi thiết bị?');">
                                <button type="submit" class="bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg px-3 py-1.5 font-medium transition-colors border border-transparent">Thu hồi</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
