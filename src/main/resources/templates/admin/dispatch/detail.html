<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::#main-content})}" th:with="pageTitle='Chi tiết phiếu cấp phát'">
<body>
<div id="main-content" class="w-full max-w-7xl mx-auto space-y-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">Chi tiết phiếu cấp phát</h2>
            <p class="text-slate-500 mt-2" th:text="'Phiếu #' + ${record.recordId}">Phiếu #1</p>
        </div>
        <a th:href="@{/admin/dispatch}" class="bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg px-4 py-2 font-medium transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại
        </a>
    </div>

    <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 max-w-3xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 border-b border-slate-100 pb-8">
            <div>
                <p class="text-sm font-semibold text-slate-500">Sinh viên</p>
                <p class="text-lg font-bold text-slate-800 mt-1" th:text="${record.studentName}">Tên SV</p>
            </div>
            <div>
                <p class="text-sm font-semibold text-slate-500">Trạng thái</p>
                <div class="mt-1">
                    <!-- status là String, không cần gọi .name() (Bug #23) -->
                    <span th:if="${record.status == 'PENDING_DISPATCH'}" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-amber-100 text-amber-800">Chờ cấp phát</span>
                    <span th:if="${record.status == 'DISPATCHED'}" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">Đang mượn</span>
                    <span th:if="${record.status == 'RETURNED'}" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-emerald-100 text-emerald-800">Đã hoàn trả</span>
                    <span th:if="${record.status == 'OVERDUE'}" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-700">Quá hạn</span>
                </div>
            </div>
            <div>
                <p class="text-sm font-semibold text-slate-500">Ngày tư vấn</p>
                <p class="text-base text-slate-800 mt-1" th:text="${#temporals.format(record.sessionDate, 'dd/MM/yyyy')}">12/12/2026</p>
            </div>
        </div>

        <div>
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-secondary">devices</span>
                Danh sách thiết bị yêu cầu
            </h3>
            
            <ul th:if="${not #lists.isEmpty(record.equipmentSummary)}" class="divide-y divide-slate-100 bg-slate-50 rounded-xl border border-slate-100 px-4">
                <li th:each="item : ${record.equipmentSummary}" class="py-3 text-slate-700 font-medium flex items-center before:content-['•'] before:mr-2 before:text-secondary">
                    <span th:text="${item}">Tên thiết bị x1</span>
                </li>
            </ul>
            <p th:if="${#lists.isEmpty(record.equipmentSummary)}" class="text-slate-500 italic">Không có dữ liệu thiết bị.</p>
        </div>
    </div>
</div>
</body>
</html>
