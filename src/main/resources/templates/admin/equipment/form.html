<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::#main-content})}" th:with="pageTitle=${mode == 'edit' ? 'Cập nhật thiết bị' : 'Thêm thiết bị mới'}">
<body>
<div id="main-content" class="w-full max-w-7xl mx-auto space-y-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-slate-800" th:text="${mode == 'edit' ? 'Cập nhật thiết bị' : 'Thêm thiết bị mới'}">Thêm thiết bị</h2>
            <p class="text-slate-500 mt-2">Nhập thông tin chi tiết về tài sản thiết bị vào kho.</p>
        </div>
        <a th:href="@{/admin/equipment}" class="bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg px-4 py-2 font-medium transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại
        </a>
    </div>

    <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 max-w-3xl mx-auto">
        <!-- Dùng @{} expression để Thymeleaf tự xử lý context path và URL encoding (Bug #9) -->
        <form th:action="${mode == 'edit' ? @{/admin/equipment/{id}/edit(id=${equipment.id})} : @{/admin/equipment}}" th:object="${equipment}" method="post" class="space-y-6">
            <input type="hidden" th:if="${mode == 'edit'}" th:field="*{id}" />
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">Tên thiết bị</label>
                    <input type="text" th:field="*{name}" id="name" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" required/>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-sm mt-1"></p>
                </div>
                
                <div>
                    <label for="category" class="block text-sm font-semibold text-slate-700 mb-2">Danh mục</label>
                    <input type="text" th:field="*{category}" id="category" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" required placeholder="VD: Laptop, Cáp nối, ..."/>
                    <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-red-500 text-sm mt-1"></p>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="quantityTotal" class="block text-sm font-semibold text-slate-700 mb-2">Tổng số lượng</label>
                        <input type="number" min="0" th:field="*{quantityTotal}" id="quantityTotal" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" required/>
                        <p th:if="${#fields.hasErrors('quantityTotal')}" th:errors="*{quantityTotal}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                    <div>
                        <label for="quantityAvailable" class="block text-sm font-semibold text-slate-700 mb-2">SL có sẵn</label>
                        <input type="number" min="0" th:field="*{quantityAvailable}" id="quantityAvailable" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" required/>
                        <p th:if="${#fields.hasErrors('quantityAvailable')}" th:errors="*{quantityAvailable}" class="text-red-500 text-sm mt-1"></p>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label for="description" class="block text-sm font-semibold text-slate-700 mb-2">Mô tả chi tiết</label>
                    <textarea th:field="*{description}" id="description" rows="4" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all"></textarea>
                    <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-red-500 text-sm mt-1"></p>
                </div>
            </div>
            
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/admin/equipment}" class="bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg px-6 py-3 font-medium transition-colors">
                    Hủy
                </a>
                <button type="submit" class="bg-secondary hover:bg-secondary-container text-white px-8 py-3 rounded-xl font-medium transition-colors shadow-sm">
                    Lưu thiết bị
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
