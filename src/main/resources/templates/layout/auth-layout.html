<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle : 'Smart Academic & Lab Support'}"></title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#131b2e",
                        "background": "#f7f9fb",
                        "inverse-primary": "#bec6e0",
                        "on-background": "#191c1e",
                        "secondary": "#0058be",
                        "on-tertiary-fixed-variant": "#38485d",
                        "tertiary-container": "#0b1c30",
                        "outline": "#76777d",
                        "primary-container": "#131b2e",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "surface-variant": "#e0e3e5",
                        "on-surface": "#191c1e",
                        "on-secondary-container": "#fefcff",
                        "surface-container": "#eceef0",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary-fixed-variant": "#004395",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary-container": "#75859d",
                        "outline-variant": "#c6c6cd",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#7c839b",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-surface-variant": "#45464d",
                        "primary-fixed-dim": "#bec6e0",
                        "primary-fixed": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#565e74",
                        "secondary-container": "#2170e4",
                        "secondary-fixed": "#d8e2ff",
                        "surface-container-high": "#e6e8ea",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary": "#000000"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        unit: "8px",
                        "container-max": "1440px",
                        gutter: "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                        "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased h-screen flex overflow-hidden m-0">
    <div th:replace="${content}"></div>
</body>
</html>
