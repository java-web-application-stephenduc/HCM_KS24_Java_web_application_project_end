<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::#main-content})}" th:with="pageTitle='Đặt lịch thành công'">
<body>
<div id="main-content" class="w-full max-w-container-max mx-auto flex items-center justify-center min-h-[60vh]">
    <div class="bg-surface rounded-xl p-12 border border-outline-variant shadow-sm max-w-md text-center">
        <div class="w-24 h-24 bg-tertiary-fixed text-tertiary-container rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
        <h2 class="font-headline-md text-headline-md text-primary mb-2">Đặt lịch thành công!</h2>
        <p class="font-body-md text-body-md text-on-surface-variant mb-8">Lịch hẹn của bạn đã được ghi nhận. Vui lòng kiểm tra mục Lịch sử học tập để theo dõi trạng thái duyệt của Giảng viên.</p>

        <div class="flex flex-col gap-3">
            <a th:href="@{/student/dashboard}" class="inline-flex bg-secondary text-on-secondary hover:bg-secondary-container transition-colors font-label-md text-label-md px-8 py-3 rounded-lg w-full justify-center shadow-sm">
                Về bảng điều khiển
            </a>
            <a th:href="@{/student/history}" class="inline-flex border border-outline-variant text-on-surface hover:bg-surface-container transition-colors font-label-md text-label-md px-8 py-3 rounded-lg w-full justify-center">
                Xem lịch sử
            </a>
        </div>
    </div>
</div>
</body>
</html>
