<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>
<nav th:fragment="sidebar" class="hidden md:flex flex-col w-64 bg-surface-container-low border-r border-outline-variant h-full py-6 z-40 shrink-0">
    <div class="px-6 mb-8 flex flex-col items-center">
        <div class="w-14 h-14 rounded-2xl bg-secondary text-on-secondary flex items-center justify-center mb-3 shadow-sm">
            <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">science</span>
        </div>
        <h1 class="font-headline-sm text-headline-sm font-bold text-primary">Cổng học vụ</h1>
        <p class="font-label-md text-label-md text-on-surface-variant mt-1">Hệ thống quản lý phòng thí nghiệm</p>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="sidebar-menu">
        <a th:href="@{/dashboard}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md">
            <span class="material-symbols-outlined">dashboard</span>
            <span>Tổng quan</span>
        </a>

        <!-- Sinh viên -->
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/booking/step1}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md mt-2">
            <span class="material-symbols-outlined">add_box</span>
            <span>Đặt lịch mới</span>
        </a>
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/history}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md">
            <span class="material-symbols-outlined">history</span>
            <span>Lịch sử</span>
        </a>

        <!-- Giảng viên -->
        <a sec:authorize="hasRole('LECTURER')" th:href="@{/lecturer/queue}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md mt-2">
            <span class="material-symbols-outlined">inbox</span>
            <span>Hàng đợi duyệt</span>
        </a>

        <!-- Admin -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/equipment}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md mt-2">
            <span class="material-symbols-outlined">inventory_2</span>
            <span>Quản lý thiết bị</span>
        </a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dispatch}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md">
            <span class="material-symbols-outlined">assignment_return</span>
            <span>Quản lý xuất kho</span>
        </a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md">
            <span class="material-symbols-outlined">settings</span>
            <span>Quản lý hệ thống</span>
        </a>
    </div>

    <div class="px-4 pt-4 border-t border-outline-variant">
        <a th:href="@{/profile}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-all font-label-md text-label-md">
            <span class="material-symbols-outlined">person</span>
            <span>Hồ sơ cá nhân</span>
        </a>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-error-container hover:text-on-error-container transition-all font-label-md text-label-md mt-1">
                <span class="material-symbols-outlined">logout</span>
                Đăng xuất
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const currentPath = window.location.pathname;
            const links = document.querySelectorAll('.sidebar-link');
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (currentPath === href || (href !== '/dashboard' && currentPath.startsWith(href))) {
                    link.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-highest');
                    link.classList.add('bg-secondary', 'text-on-secondary');
                }
            });
        });
    </script>
</nav>
</body>
</html>
