    <div th:if="${error}" class="p-4 bg-error-container text-on-error-container rounded-lg border border-error flex items-center gap-2">
        <span class="material-symbols-outlined text-error">error</span><span th:text="${error}"></span>
    </div>
    <div th:if="${success}" class="p-4 bg-tertiary-fixed text-on-tertiary-fixed-variant rounded-lg border border-tertiary-fixed-dim flex items-center gap-2">

            <!-- Password Change Form -->

                <h2 class="font-headline-sm text-headline-sm text-on-surface mb-6 border-b border-surface-variant pb-2">Đổi mật khẩu</h2>
                <form th:action="@{/profile/change-password}" method="post" class="space-y-4">

                        <label for="oldPassword" class="font-label-md text-label-md text-on-surface">Mật khẩu cũ</label>

                    </div>
                    <div class="space-y-1">
                        <label for="newPassword" class="font-label-md text-label-md text-on-surface">Mật khẩu mới</label>

                    </div>
                    <div class="space-y-1">
                        <label for="confirmPassword" class="font-label-md text-label-md text-on-surface">Xác nhận mật khẩu</label>
                        <input type="password" name="confirmPassword" id="confirmPassword" class="w-full bg-surface border border-outline-variant rounded-lg px-3 py-2 text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary" required/>
                    </div>
                    <button type="submit" class="w-full mt-2 px-6 py-2 rounded-lg bg-secondary text-on-secondary font-label-md text-label-md hover:bg-secondary-container transition-colors shadow-sm inline-flex items-center justify-center gap-2">
                        Cập nhật mật khẩu
                        <span class="material-symbols-outlined text-[16px]">lock_reset</span>
                    </button>
                </form>

<script>
    document.getElementById('avatarFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 2 * 1024 * 1024) {
                alert("Kích thước ảnh vượt quá giới hạn 2MB. Vui lòng chọn ảnh nhỏ hơn.");
                e.target.value = ""; // Reset input
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                const preview = document.getElementById('avatarPreview');
                const icon = document.getElementById('avatarIcon');

                preview.src = event.target.result;
                preview.classList.remove('hidden');
                if (icon) {
                    icon.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }
    });
</script>
