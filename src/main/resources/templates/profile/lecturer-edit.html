<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::#main-content})}" th:with="pageTitle='Chỉnh sửa hồ sơ Giảng viên'">
<body>
<div id="main-content" class="w-full max-w-7xl mx-auto space-y-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-slate-800">Chỉnh sửa hồ sơ</h2>
            <p class="text-slate-500 mt-2">Cập nhật thông tin giảng viên và liên hệ.</p>
        </div>
        <a th:href="@{/profile}" class="bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg px-4 py-2 font-medium transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại
        </a>
    </div>

    <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 max-w-3xl mx-auto">
        <form th:action="@{/profile/edit}" th:object="${profile}" method="post" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email (Không thể đổi)</label>
                    <input type="text" th:value="${user.email}" disabled class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-slate-50 text-slate-500 cursor-not-allowed"/>
                </div>
                
                <div class="md:col-span-2">
                    <label for="fullName" class="block text-sm font-semibold text-slate-700 mb-2">Họ và tên</label>
                    <input type="text" th:field="*{fullName}" id="fullName" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" required/>
                    <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-red-500 text-sm mt-1"></p>
                </div>
                
                <div>
                    <label for="phone" class="block text-sm font-semibold text-slate-700 mb-2">Số điện thoại</label>
                    <input type="tel" th:field="*{phone}" id="phone" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all"/>
                    <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-red-500 text-sm mt-1"></p>
                </div>
                
                <div>
                    <label for="departmentId" class="block text-sm font-semibold text-slate-700 mb-2">Khoa trực thuộc</label>
                    <select th:field="*{departmentId}" id="departmentId" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all bg-white" required>
                        <option value="" disabled>-- Chọn khoa --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>
                    <p th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}" class="text-red-500 text-sm mt-1"></p>
                </div>
                
                <div class="md:col-span-2">
                    <label for="title" class="block text-sm font-semibold text-slate-700 mb-2">Chức danh / Học hàm, học vị</label>
                    <input type="text" th:field="*{title}" id="title" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" placeholder="VD: TS. Nguyễn Văn A, ThS, ..."/>
                    <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-red-500 text-sm mt-1"></p>
                </div>
                
                <div class="md:col-span-2">
                    <label for="bio" class="block text-sm font-semibold text-slate-700 mb-2">Giới thiệu bản thân (Tiểu sử)</label>
                    <textarea th:field="*{bio}" id="bio" rows="4" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" placeholder="Nhập tiểu sử, hướng nghiên cứu, lịch rảnh..."></textarea>
                    <p th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}" class="text-red-500 text-sm mt-1"></p>
                </div>
            </div>
            
            <div class="flex justify-end gap-3 pt-6 border-t border-slate-100">
                <a th:href="@{/profile}" class="bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg px-6 py-3 font-medium transition-colors">
                    Hủy
                </a>
                <button type="submit" class="bg-secondary hover:bg-secondary-container text-white px-8 py-3 rounded-xl font-medium transition-colors shadow-sm">
                    Lưu thông tin
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
