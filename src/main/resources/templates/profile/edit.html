<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::#main-content})}" th:with="pageTitle='Chỉnh sửa hồ sơ'">
<body>
<div id="main-content" class="w-full max-w-container-max mx-auto flex flex-col gap-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="font-headline-md text-headline-md text-primary">Chỉnh sửa hồ sơ</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">Cập nhật thông tin cá nhân của bạn.</p>
        </div>
        <a th:href="@{/profile}" class="h-10 px-4 rounded-lg border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors inline-flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại
        </a>
    </div>

    <div class="bg-surface rounded-xl p-8 border border-outline-variant shadow-sm max-w-3xl mx-auto w-full">
        <form th:action="@{/profile/edit}" th:object="${profile}" method="post" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block font-label-md text-label-md text-on-surface mb-2">Email (Không thể đổi)</label>
                    <input type="text" th:value="${user.email}" disabled class="w-full h-11 px-3 bg-surface-container-low border border-outline-variant rounded-lg text-on-surface-variant cursor-not-allowed font-body-md text-body-md"/>
                </div>

                <div class="md:col-span-2">
                    <label for="fullName" class="block font-label-md text-label-md text-on-surface mb-2">Họ và tên</label>
                    <input type="text" th:field="*{fullName}" id="fullName" class="w-full h-11 px-3 bg-surface-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface transition-colors" required/>
                    <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="mt-1 font-label-md text-label-md text-error"></p>
                </div>

                <div>
                    <label for="phone" class="block font-label-md text-label-md text-on-surface mb-2">Số điện thoại</label>
                    <input type="tel" th:field="*{phone}" id="phone" class="w-full h-11 px-3 bg-surface-lowest border border-outline-variant rounded-lg focus:border-secondary focus:ring-1 focus:ring-secondary outline-none font-body-md text-body-md text-on-surface transition-colors"/>
                    <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="mt-1 font-label-md text-label-md text-error"></p>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-6 border-t border-outline-variant">
                <a th:href="@{/profile}" class="h-11 px-6 rounded-lg border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors inline-flex items-center">Hủy</a>
                <button type="submit" class="h-11 px-8 rounded-lg bg-secondary text-on-secondary font-label-md text-label-md font-bold hover:bg-secondary-container transition-colors shadow-sm inline-flex items-center gap-2">
                    Lưu thay đổi
                    <span class="material-symbols-outlined text-lg">save</span>
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
