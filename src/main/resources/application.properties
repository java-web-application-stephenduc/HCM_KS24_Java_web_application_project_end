spring.application.name=Smart_Academic_Lab_Support_Platform

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/salsp?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=310306
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate - dùng update để tự đồng bộ schema khi khởi động
# Cảnh báo: Trên production nên dùng validate kết hợp Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL init - chỉ chạy schema.sql khi DB chưa có bảng (lần đầu tiên)
spring.sql.init.mode=embedded
